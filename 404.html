<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var docEl = document.documentElement;
        docEl.classList.add("js");
        function applyMode(isLight) {
          docEl.classList.toggle("u-mode-light", isLight);
          docEl.classList.toggle("u-mode-dark", !isLight);
        }
        try {
          var savedTheme = localStorage.getItem("savedTheme");
          var osQuery = window.matchMedia("(prefers-color-scheme: dark)");
          applyMode(savedTheme !== null ? savedTheme === "light" : !osQuery.matches);
          if (savedTheme === null) {
            osQuery.addEventListener("change", function (e) {
              try {
                if (localStorage.getItem("savedTheme") !== null) return;
              } catch (err) {}
              applyMode(!e.matches);
            });
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="preload" href="/fonts/GeneralSans-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeneralSans-Medium.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="white" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="Mast" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/webclip.png" />
  </head>
  <body>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
